name: CI

# Public repo: required PR checks always run; docs-only main pushes skip it.
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    name: ${{ matrix.profile == 'default' && format('Rust {0}', matrix.platform.target) || format('Rust {0} / {1}', matrix.platform.target, matrix.profile) }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
        profile: [default, apt-agent, apt-remote, apt-executor, inventory-agent]
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Select build profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$PROFILE" = default ]; then
            echo 'FEATURE_ARGS=' >> "$GITHUB_ENV"
          else
            echo "FEATURE_ARGS=--no-default-features --features $PROFILE" >> "$GITHUB_ENV"
          fi
      - name: Test
        run: cargo test --all --locked $FEATURE_ARGS
      - name: Clippy
        run: cargo clippy --all-targets --locked $FEATURE_ARGS -- -D warnings
      - name: Verify pure isolated-refresh protocol contracts
        if: matrix.profile == 'inventory-agent'
        run: python3 -B -m unittest discover -s tests -p test_inventory_refresh_protocol.py -v
      - name: Compare native Linux inventory with dpkg without refresh
        if: matrix.profile == 'inventory-agent' && matrix.platform.target == 'aarch64-unknown-linux-gnu'
        env:
          GUARDED_UPDATE_NATIVE_INVENTORY_TEST: '1'
        run: cargo test --locked --no-default-features --features inventory-agent --bin command-center-inventory native_linux_inventory_matches_dpkg
      - name: Build co-installable macOS inventory archive
        if: matrix.profile == 'inventory-agent' && matrix.platform.target == 'aarch64-apple-darwin'
        run: bash scripts/package-inventory.sh aarch64-apple-darwin dist
      - uses: actions/upload-artifact@v4
        if: matrix.profile == 'inventory-agent' && matrix.platform.target == 'aarch64-apple-darwin'
        with:
          name: command-center-inventory-macos
          path: dist/command-center-inventory-*
          if-no-files-found: error

  inventory-refresh-storage:
    name: Native isolated inventory storage containment
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify pure protocol and descriptor publication regressions
        run: python3 -B -m unittest discover -s tests -p 'test_inventory_refresh*.py' -v
      - name: Build separate inactive inventory metadata helper archive
        run: python3 -I -B -S scripts/package-inventory-helper.py "$RUNNER_TEMP/inventory-helper-source"
      - name: Build isolated unprivileged Rust parent fixture
        run: python3 -I -B -S tests/native_inventory_refresh_rust_build.py
      - name: Prove actual tmpfs, cgroup and separate-UID limits on disposable runner
        run: |
          sudo --preserve-env=GITHUB_ACTIONS python3 -B tests/native_inventory_refresh_storage.py > native-refresh-storage-proof.json
      - name: Verify real signed TLS repository acquisition through the fixed low-privilege worker
        run: |
          archive_commit="$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}')"
          sudo --preserve-env=GITHUB_ACTIONS python3 -B tests/native_inventory_refresh_apt.py "$RUNNER_TEMP/inventory-helper-source/helper-$archive_commit/command-center-inventory-metadata-helper.tar.gz" > native-refresh-apt-proof.json
      - name: Prove actual native package locks and exact observation release on disposable runner
        run: |
          sudo --preserve-env=GITHUB_ACTIONS python3 -B tests/native_inventory_refresh_observation.py > native-refresh-observation-proof.json
      - name: Verify actual read-only native observation sandbox
        run: |
          sudo /usr/bin/systemd-run --quiet --wait --collect --pipe --unit=command-center-inventory-readonly-proof --property=ProtectSystem=strict --property=RuntimeMaxSec=30 --property=Restart=no --setenv=GITHUB_ACTIONS=true --setenv=GUARDED_UPDATE_NATIVE_READONLY_PROOF=1 /usr/bin/python3 -B "$GITHUB_WORKSPACE/tests/native_inventory_refresh_observation.py" > native-refresh-readonly-observation-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-rust-parent-fixture-build
          path: ${{ runner.temp }}/inventory-rust-parent/manifest.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: command-center-inventory-metadata-helper-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/inventory-helper-source/helper-*/command-center-inventory-metadata-helper.tar.gz
            ${{ runner.temp }}/inventory-helper-source/helper-*/command-center-inventory-metadata-helper.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: native-inventory-refresh-readonly-observation-proof
          path: native-refresh-readonly-observation-proof.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-inventory-refresh-observation-proof
          path: native-refresh-observation-proof.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-inventory-refresh-apt-proof
          path: native-refresh-apt-proof.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-inventory-refresh-storage-proof
          path: native-refresh-storage-proof.json
          if-no-files-found: error

  inventory-refresh-physical-sample:
    name: Native reporter physical sample (experimental)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build separate inactive inventory metadata helper archive
        run: python3 -I -B -S scripts/package-inventory-helper.py "$RUNNER_TEMP/inventory-helper-source"
      - name: Build isolated unprivileged Rust parent fixture
        run: python3 -I -B -S tests/native_inventory_refresh_rust_build.py
      - name: Prepare disposable tmpfs and cgroup fixtures
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -B tests/native_inventory_refresh_storage.py > native-refresh-storage-proof.json
      - name: Verify actual sampled reporter process profile
        env:
          GUARDED_UPDATE_NATIVE_BARRIER_PROOF: '1'
        run: |
          archive_commit="$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}')"
          sudo --preserve-env=GITHUB_ACTIONS,GUARDED_UPDATE_NATIVE_BARRIER_PROOF python3 -B tests/native_inventory_refresh_apt.py "$RUNNER_TEMP/inventory-helper-source/helper-$archive_commit/command-center-inventory-metadata-helper.tar.gz" > native-reporter-physical-sample-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-reporter-physical-sample-proof
          path: native-reporter-physical-sample-proof.json
          if-no-files-found: error

  inventory-cross-uid-cas:
    name: Synthetic cross-UID journal admission (${{ matrix.mode }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [positive, epoch, floor, replay, lost]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test cross-UID fixture gates
        run: python3 -B -m unittest discover -s tests -p 'test_inventory_cross_uid*.py' -v
      - name: Build separate inactive inventory metadata helper archive
        run: python3 -I -B -S scripts/package-inventory-helper.py "$RUNNER_TEMP/inventory-helper-source"
      - name: Build isolated unprivileged Rust parent fixture
        run: python3 -I -B -S tests/native_inventory_refresh_rust_build.py
      - name: Verify synthetic cross-UID journal admission
        env:
          GUARDED_UPDATE_CROSS_UID_MODE: ${{ matrix.mode }}
        run: |
          archive_commit="$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}')"
          sudo --preserve-env=GITHUB_ACTIONS,GUARDED_UPDATE_CROSS_UID_MODE python3 -B tests/native_inventory_cross_uid.py "$RUNNER_TEMP/inventory-helper-source/helper-$archive_commit/command-center-inventory-metadata-helper.tar.gz" > native-cross-uid-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-cross-uid-proof-${{ matrix.mode }}
          path: native-cross-uid-proof.json
          if-no-files-found: error

  inventory-public-marker:
    name: Synthetic cross-UID maintenance marker
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test public marker fixture gates
        run: python3 -B -m unittest discover -s tests -p 'test_inventory_refresh_maintenance_public_native.py' -v
      - name: Build separate inactive inventory metadata helper archive
        run: python3 -I -B -S scripts/package-inventory-helper.py "$RUNNER_TEMP/inventory-helper-source"
      - name: Verify public marker across identities
        run: |
          archive_commit="$(git --no-replace-objects rev-parse --verify 'HEAD^{commit}')"
          sudo --preserve-env=GITHUB_ACTIONS python3 -B tests/native_inventory_maintenance_public.py "$RUNNER_TEMP/inventory-helper-source/helper-$archive_commit/command-center-inventory-metadata-helper.tar.gz" > native-public-marker-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-public-marker-proof
          path: native-public-marker-proof.json
          if-no-files-found: error

  windows-discovery:
    name: Native Windows provider discovery contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify native PowerShell discovery with synthetic module data
        shell: pwsh
        run: |
          if (-not (Test-Path tests/test_winget_provider.py)) { throw 'WinGet contract test missing' }
          python -B -m unittest discover -s tests -p 'test_winget*.py' -v

  armv7:
    name: ARMv7 remote build (not a release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: armv7-apt-remote
      - name: Install cross linker on CI runner
        timeout-minutes: 5
        run: |
          # The runner's Azure mirror can stall past this step's five-minute bound.
          # Use official Ubuntu sources only for this CI prerequisite installation.
          ci_sources_file="$RUNNER_TEMP/guarded-update-ci.sources"
          ci_apt_lists="/var/lib/apt/guarded-update-ci-lists"
          cat > "$ci_sources_file" <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          sudo install -d -m 0755 "$ci_apt_lists" "$ci_apt_lists/partial"
          ci_apt_options=(
            -o "Dir::Etc::sourcelist=$ci_sources_file"
            -o 'Dir::Etc::sourceparts=-'
            -o "Dir::State::lists=$ci_apt_lists"
            -o 'Acquire::Retries=1'
            -o 'Acquire::http::Timeout=20'
            -o 'Acquire::https::Timeout=20'
            -o 'Acquire::AllowInsecureRepositories=false'
            -o 'APT::Get::AllowUnauthenticated=false'
            -o 'APT::Update::Error-Mode=any'
          )
          sudo apt-get "${ci_apt_options[@]}" update
          sudo apt-get "${ci_apt_options[@]}" install --yes --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - name: Build Linux-only ARMv7 packages
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          for profile in apt-agent apt-remote apt-executor; do
            bash scripts/package-apt.sh "$profile" armv7-unknown-linux-gnueabihf dist
          done
          bash scripts/test-packages.sh dist
      - name: Build and emulate separate Linux reporting archives
        run: |
          python3 -m unittest discover -s tests -p test_inventory_packaging.py -v
          bash scripts/build-inventory-linux.sh inventory-dist
      - name: Preserve separate Linux inventory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: command-center-inventory-linux
          path: inventory-dist/*.tar.gz*
          if-no-files-found: error
      - name: Upload explicit opt-in ARMv7 packages
        uses: actions/upload-artifact@v4
        with:
          name: guarded-update-armhf-packages
          path: dist/*.deb
          if-no-files-found: error

  apt-hook:
    name: Disposable Linux APT rejection hook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: apt-executor-hook
      - name: Capture rejected synthetic transaction in isolated APT state
        run: |
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            GUARDED_UPDATE_DISPOSABLE_TEST=1 GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT=github-hosted RUNNER_TEMP="$RUNNER_TEMP" \
            GUARDED_UPDATE_HOOK_OUTPUT="$RUNNER_TEMP/apt-hook-fixture" \
            bash scripts/test-apt-hook.sh
      - name: Validate real protocol stream as ordinary runner user
        env:
          GUARDED_UPDATE_DISPOSABLE_TEST: "1"
          GUARDED_UPDATE_HOOK_STREAM_FILE: ${{ runner.temp }}/apt-hook-fixture/hook-stream
          GUARDED_UPDATE_FIXTURE_ARCHIVE: ${{ runner.temp }}/apt-hook-fixture/fixture.deb
        run: >-
          cargo test --locked --features apt-executor
          execution_gate::gate_tests::disposable_linux_real_apt_hook_stream_matches_archive
          -- --ignored --exact

      - name: Build executor for isolated upgrade integration
        run: cargo build --locked --features apt-executor
      - name: Verify real isolated upgrade and rejection cases
        run: |
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            GUARDED_UPDATE_DISPOSABLE_TEST=1 GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT=github-hosted \
            python3 -I scripts/test-execution-upgrade.py "$PWD/target/debug/guarded-update"
      - name: Test production APT adapter invariants
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
