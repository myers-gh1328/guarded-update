name: Disposable installer primitives proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'myers-gh1328/guarded-update' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise isolated synthetic package and transient service
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_EVENT_NAME
          python3 tests/ephemeral_installer_primitives.py
