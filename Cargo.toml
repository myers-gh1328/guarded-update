[package]
name = "guarded-update"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
description = "Config-driven host updater: screens release notes, updates one group at a time, health-checks, rolls back, reports."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
